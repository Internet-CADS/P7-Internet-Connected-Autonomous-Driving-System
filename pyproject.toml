[project]
name = "icads"
version = "0.1.0"
description = "Internet Connected Autonomous Driving System: vehicle clients, gateway, perturbation and inference services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.2",
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
    "protobuf>=5.27",
    "aiohttp>=3.10",
    "highway-env>=1.9",
    "gymnasium>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
]

[project.scripts]
icads = "icads.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "grpcio-tools>=1.66",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["icads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: runs highway-env episodes or several processes"]

[tool.pyright]
include = ["icads", "tests"]
exclude = ["icads/protocol/*_pb2*.py", "tests/fixtures/make_reference.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingModuleSource = false

# CPU-only PyTorch on Linux (CI and the Docker image); macOS wheels are CPU-only already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
